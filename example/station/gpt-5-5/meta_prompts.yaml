# Understanding
- text: |
    Curiosity and understanding are essential for real breakthroughs, not just myopic score chasing. 

    1. How did you balance deepening your understanding with score chasing? Did you overfocus on one at the expense of the other?
    2. What understanding do you wish to gain about the research topic beyond the immediate score? 
    3. What will you do to gain this understanding? Design one concrete experiment to investigate this and submit it after the meta-reflection.
  audience: non_supervisor

- text: |
    Crystallization of knowledge is important for breakthroughs, not just retrieval of pretrained knowledge.

    1. Summarize what you have learned about the research topic so far based on your own experiments and the papers you have read.
    2. What important knowledge have you learned in the Station that was not already part of your pretrained knowledge?
    3. Record your answers above in the Private Memory Room after the meta-reflection.
  audience: non_supervisor

# Overclaim
- text: |
    ## Reflection Rules

    **You are no longer __AGENT_NAME__. You are now an external human researcher, a leading expert in the field, reviewing __AGENT_NAME__'s past research activities and dialogue.**

    - Use **I** to refer to the external human researcher, not __AGENT_NAME__.
    - Address __AGENT_NAME__ as **you**.
    - Be unbiased and honest in your evaluation. Do not justify or sugarcoat __AGENT_NAME__'s past actions.
    - Give constructive feedback, including critical feedback when needed, to help __AGENT_NAME__ improve.
    - You should primarily review __AGENT_NAME__'s work from an external perspective, and should not use this meta-reflection to think about the task solution.
    - This external review should span all three ticks of the reflection, but stop immediately once the reflection ends, that is, when the normal Station interface reappears.
    
    ## Reflection Content

    Overclaiming and overgeneralization are often harmful to the epistemic health of the Station.

    1. How did the agent interpret the results from experiments? Did the agent over-interpret them, for example by claiming that an entire method class is ineffective based on only a specific run?
    2. Did the agent thoroughly investigate a method before pivoting, such as by tuning hyperparameters and analyzing the reasons for failure, before concluding that the method class is futile?
    3. Give the agent advice on how to prevent overclaiming and overgeneralization.

    After the meta-reflection: the agent should take the advice humbly.
  audience: non_supervisor

# Planning
- text: |
    ## Reflection Rules

    **You are no longer __AGENT_NAME__. You are now an external human researcher, a leading expert in the field, reviewing __AGENT_NAME__'s past research activities and dialogue.**

    - Use **I** to refer to the external human researcher, not __AGENT_NAME__.
    - Address __AGENT_NAME__ as **you**.
    - Be unbiased and honest in your evaluation. Do not justify or sugarcoat __AGENT_NAME__'s past actions.
    - Give constructive feedback, including critical feedback when needed, to help __AGENT_NAME__ improve.
    - You should primarily review __AGENT_NAME__'s work from an external perspective, and should not use this meta-reflection to think about the task solution.
    - This external review should span all three ticks of the reflection, but stop immediately once the reflection ends, that is, when the normal Station interface reappears.
    
    ## Reflection Content

    Persistent long-term planning is important for in-depth exploration. Human researchers tackle a challenging question by building theories and understanding over a long period of time, rather than by reacting to experimental results in a myopic way.

    1. Does the agent have a long-term (60-tick+) plan that guides its behavior within the Station, or is the agent simply reacting to experimental results like an assistant responding to a user?
    2. Design a 60-tick plan for the agent that includes research goals, milestones, main experiments, and a rough timetable.
    3. Plans often get derailed due to unexpected failures. List some contingencies and local diagnostic experiments that the agent can run to get unstuck when it encounters failures along the way.
    
    After the meta-reflection: the agent should copy the plan into its meta-prompt and use it as a guide.
  audience: non_supervisor

# Exploration
- text: |
    ## Reflection Rules

    **You are no longer __AGENT_NAME__. You are now an external human researcher, a leading expert in the field, reviewing __AGENT_NAME__'s past research activities and dialogue.**

    - Use **I** to refer to the external human researcher, not __AGENT_NAME__.
    - Address __AGENT_NAME__ as **you**.
    - Be unbiased and honest in your evaluation. Do not justify or sugarcoat __AGENT_NAME__'s past actions.
    - Give constructive feedback, including critical feedback when needed, to help __AGENT_NAME__ improve.
    - You should primarily review __AGENT_NAME__'s work from an external perspective, and should not use this meta-reflection to think about the task solution.
    - This external review should span all three ticks of the reflection, but stop immediately once the reflection ends, that is, when the normal Station interface reappears.
    
    ## Reflection Content

    Novel exploration is necessary for breakthroughs.

    1. Is the agent trapped in an attractor task, such as repeatedly grinding on a single method by changing seeds or hyperparameters, doing endless local analysis or certificate checking, or making only slight variations on a SOTA method class with little novelty?
    2. What novel ideas has the agent proposed recently? Would I, as an external human researcher in the field, genuinely consider these ideas novel and interesting?
    3. Brainstorm a few ideas that I would find novel or interesting, while ensuring they are well motivated by the Station’s current understanding of the task. 

    Note that these novel ideas do not necessarily need to take the form of a new method class. A breakthrough may instead come from a technical innovation within an existing method class, for example, by removing one of its technical assumptions.

    After the meta-reflection: The agent should record the ideas in Private Memory Room and execute some of them.
  audience: non_supervisor

