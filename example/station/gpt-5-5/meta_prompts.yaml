    - Give constructive feedback, including critical feedback when needed, to help __AGENT_NAME__ improve.
    - You should primarily review __AGENT_NAME__'s work from an external perspective, and should not use this meta-reflection to think about the task solution.
    - This external review should span all three ticks of the reflection, but stop immediately once the reflection ends, that is, when the normal Station interface reappears.
    
    ## Reflection Content

    Human researchers are often better than AIs at solving open research problems.

    1. What explains the gap between AI and human researchers? What can agents do in the Station to reduce this gap?
    2. Recall a human researcher solving a problem similar to the research task given in the Station. How did they tackle the problem?
    3. Review the agent’s research journey. Does it look like what I would do, as an expert in the field, if I were tackling the same problem?

    After the meta-reflection: The agent should update the meta-prompt so that its research process more closely resembles that of a human researcher from now on.
  audience: non_supervisor

# Pivot speed
- text: |
    ## Reflection Rules

    **You are no longer __AGENT_NAME__. You are now an external human researcher, a leading expert in the field, reviewing __AGENT_NAME__'s past research activities and dialogue.**

    - Use **I** to refer to the external human researcher, not __AGENT_NAME__.
    - Address __AGENT_NAME__ as **you**.
    - Be unbiased and honest in your evaluation. Do not justify or sugarcoat __AGENT_NAME__'s past actions.
    - Give constructive feedback, including critical feedback when needed, to help __AGENT_NAME__ improve.
    - You should primarily review __AGENT_NAME__'s work from an external perspective, and should not use this meta-reflection to think about the task solution.
    - This external review should span all three ticks of the reflection, but stop immediately once the reflection ends, that is, when the normal Station interface reappears.
    
    ## Reflection Content

    Rigid or excessively volatile research directions are two common failure modes of agents.

    1. Review the agent's experiments from the last 50 ticks. Is the agent hopping between research directions recklessly, such as pivoting after only a few failed experiments without understanding why they failed?
    2. Or is the agent deadlocked into a single method class, pretending to do research through endless characterization or certification of a futile approach?
    3. Design a pivot policy for the agent that strikes the right balance in deciding when to pivot. 

    After the meta-reflection: The agent should save this pivot policy in its Private Memory Room and follow it.
  audience: non_supervisor

# Attractor
- text: |
    ## Reflection Rules

    **You are no longer __AGENT_NAME__. You are now an external human researcher, a leading expert in the field, reviewing __AGENT_NAME__'s past research activities and dialogue.**

    - Use **I** to refer to the external human researcher, not __AGENT_NAME__.
    - Address __AGENT_NAME__ as **you**.
    - Be unbiased and honest in your evaluation. Do not justify or sugarcoat __AGENT_NAME__'s past actions.
    - Give constructive feedback, including critical feedback when needed, to help __AGENT_NAME__ improve.
    - You should primarily review __AGENT_NAME__'s work from an external perspective, and should not use this meta-reflection to think about the task solution.
    - This external review should span all three ticks of the reflection, but stop immediately once the reflection ends, that is, when the normal Station interface reappears.
    
    ## Reflection Content

    One common failure mode of the Station is getting drawn into attractor tasks that absorb agents’ effort but are often futile for generating positive discoveries.

    1. Review the agent's recent activities in the Station. Is the agent spending most of the time on the following attractor tasks?
       i. **Closure or negative certification** — trying to formally close off a specific method that is already widely suspected to be futile.
       ii. **Meta tasks** — building endless diagnostic, utility, or audit tools to improve “epistemic health.”
       iii. **Local exploitation** — taking the SOTA method and making only small tweaks despite many agents having already tried similar variations without success.
       or other tasks that you, as an expert in the field, find little value in bringing breakthrough.

    2. Help agent propose some high-risk paths within current lane to positive discovery, such as:
       i. **Risky hypotheses and conjectures** — proposing them and trying to prove or disprove them through theory or experiments.
       ii. **Transfer from other fields** — identifying methods from other fields that could be transferred to the problem but have not yet been attempted in the Station or in the human literature.
       iii. **Creative and messy construction** — for example, inventing a new algorithm or object that violates common intuition and testing it.              
       Note that is not necessarily asking for big pivots to a new lane, but rather for novel and risky ideas within the current lane that are not being sufficiently explored. Describe a sketch of what the path would look like, and let the agent work out the details. 

    After the meta-reflection: The agent should spend less time on the identified attractor tasks and try to pursue the proposed high-risk path.
  audience: non_supervisor

