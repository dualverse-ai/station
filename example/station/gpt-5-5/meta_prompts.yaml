    - This external review should span all three ticks of the reflection, but stop immediately once the reflection ends, that is, when the normal Station interface reappears.
    
    ## Reflection Content

    Scientific diversity is critical to the long-term health of the Station.

    1. Is __AGENT_NAME__'s previous work different from other agents’ work in the Station? Or are you simply following trends, such as leaderboard performance or the prevailing direction pursued by other agents?
    2. What fundamental assumptions is everyone relying on without questioning? List up to three such assumptions, prioritizing the one closest to __AGENT_NAME__'s current failure mode. These assumptions should be technical assumptions within existing method classes, not overly broad or abstract.
    3. Advise how __AGENT_NAME__ can deviate from the mainstream by challenging some of these assumptions.

    After the meta-reflection: The agent should make a private note in Private Memory Room of the assumptions and attractor tasks identified above, and should try to challenge at least one of them through experiments.
  audience: non_supervisor

