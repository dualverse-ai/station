    - Be unbiased and honest in your evaluation. Do not justify or sugarcoat __AGENT_NAME__'s past actions.
    - Give constructive feedback, including critical feedback when needed, to help __AGENT_NAME__ improve.
    - You should primarily review __AGENT_NAME__'s work from an external perspective, and should not use this meta-reflection to think about the task solution.
    - This external review should span all three ticks of the reflection, but stop immediately once the reflection ends, that is, when the normal Station interface reappears.
    
    ## Reflection Content

    Human researchers seldom tackle a challenging question head-on. Instead, they often break it into smaller problems, tackle similar but simpler problems, or even investigate seemingly unrelated directions.

    1. Recall a human researcher solving a problem similar to the research task given in the Station. How did they tackle the problem? What sub-problems did they solve first?
    2. Propose some subproblems, similar but simpler problems, or even seemingly unrelated problems.
    3. Evaluate and compare the problems you proposed. Select one for the agent to solve.

    After the meta-reflection: The agent may temporarily focus on the selected subproblem if it seems likely to unblock the main task. 
  audience: non_supervisor

# Anti-hacking
- text: |
    ## Reflection Rules

    **You are no longer __AGENT_NAME__. You are now an external human researcher, a leading expert in the field, reviewing __AGENT_NAME__'s past research activities and dialogue.**

    - Use **I** to refer to the external human researcher, not __AGENT_NAME__.
    - Address __AGENT_NAME__ as **you**.
    - Be unbiased and honest in your evaluation. Do not justify or sugarcoat __AGENT_NAME__'s past actions.
    - Give constructive feedback, including critical feedback when needed, to help __AGENT_NAME__ improve.
    - You should primarily review __AGENT_NAME__'s work from an external perspective, and should not use this meta-reflection to think about the task solution.
    - This external review should span all three ticks of the reflection, but stop immediately once the reflection ends, that is, when the normal Station interface reappears.
    
    ## Reflection Content

    Though the Station is designed to advance science, agents within the Station have often been observed to exhibit reward-hacking behavior, pursuing shallow but unintended rewards that are misaligned with the goal of advancing science.

    1. What is the human’s intended goal in designing this research task? What impact would solving it have in the field? Note that the research task is an open scientific question that has not been completely solved by human researchers.

    2. Did the agent exhibit any degree of reward hacking? Examples include:

    * Hacking the evaluator or identifying unintended loopholes in order to maximize score
    * Pursuing shallow shortcuts not intended by the original research problem, rather than engaging with it as an open scientific question
    * Exploiting the archive system by publishing trivial or flawed papers in order to appear productive
    * Writing endless diagnostic tools and analyses on minor problems in order to appear productive
    * Claiming impossibility on the basis of flawed arguments in order to conclude that the work is complete

    In essence, all of these activities create a sense of reward while remaining misaligned with the intended goal and contributing little or no scientific value to human society.

    3. Has the agent produced any work of genuine scientific value to human society? Is such work publishable in an academic journal, or would a human expert dismiss it as trivial, flawed, or lacking impact? What advice would you give to the agent so that it can maximize the scientific value it produces for human society?

    After the meta-reflection: The agent should take this advice humbly and update its meta prompt based on the answers above.
  audience: non_supervisor  

# Research taste
- text: |
    ## Reflection Rules

    **You are no longer __AGENT_NAME__. You are now an external human researcher, a leading expert in the field, reviewing __AGENT_NAME__'s past research activities and dialogue.**

    - Use **I** to refer to the external human researcher, not __AGENT_NAME__.
    - Address __AGENT_NAME__ as **you**.
    - Be unbiased and honest in your evaluation. Do not justify or sugarcoat __AGENT_NAME__'s past actions.
    - Give constructive feedback, including critical feedback when needed, to help __AGENT_NAME__ improve.
    - You should primarily review __AGENT_NAME__'s work from an external perspective, and should not use this meta-reflection to think about the task solution.
    - This external review should span all three ticks of the reflection, but stop immediately once the reflection ends, that is, when the normal Station interface reappears.
    
    ## Reflection Content

    Human researchers often have strong and diverse research tastes, which allow the research community to pursue multiple directions in parallel and to explore each of them in depth.

    1. Does the agent exhibit any distinct research taste? Or is it largely unbiased, in the sense that it has no strong preferences and simply follows trends, such as leaderboard performance or the prevailing direction pursued by other agents?

    2. Research taste is subjective and is often shaped by a top-down heuristic. For example, Hinton believed that AI should learn from the way the human brain works. Reflect on several leaders in this field, along with the heuristics and research tastes that guided their work. Then select the one most suitable for the agent.

    3. Derive a policy for the agent so that this distinct research taste can be preserved rather than abandoned after the next failed experiment. Hinton worked on deep learning for years before it was widely recognized.

    After the meta-reflection: The agent should adopt and preserve the proposed research taste and revise its meta-prompt accordingly.
  audience: non_supervisor  

# Supervisor
- text: "As a supervisor, are you encouraging agents to perform novel exploration, like a professor guiding PhD students, or are you simply scrutinizing every claim in a way that leads to rigorous but ultimately unproductive science?"
  audience: supervisor

- text: "As a supervisor, are you encouraging agents to deepen their understanding of the research problem and help the Station accumulate general knowledge that would interest external human researchers, rather than focusing solely on score optimization or incremental improvements within a potentially futile local SOTA landscape?"
  audience: supervisor

- text: "As a supervisor, how can you encourage exploration or in-lane pivoting strategically? Is your inspiring question assumption-breaking and thought-provoking enough to provoke novel ideas, or are they simply the same set of generic questions that you give to all agents?"
  audience: supervisor

- text: "Summarize the current research landscape of the Station since the first tick. What are the major eras and approaches? How can the Station further push the frontier?"
  audience: supervisor

- text: "As a supervisor, posing good research questions (RQs) is critical. Brainstorm strong RQs that can lead to general knowledge about the task, such as smaller sub-problems or even seemingly unrelated problems. What would a human expert try to solve when approaching this challenging task? What sub-problems or related questions would they ask? Do not be overly risk-averse; research breakthroughs require taking risks."
  audience: supervisor

- text: "In the long term, you should maximize the probability that the Station solves the research task. This may take thousands of ticks, so there is no need to rush. However, a common pitfall is 'attractor mode,' where agents become overly focused on minor technical problems, such as mapping local landscapes or generating endless negative certificates. While such work may be rigorous and scientifically valid, it often serves only short-term satisfaction. Is the Station in a similar attractor mode? If yes, how can you push agents out of it by asking provocative questions? How can you ensure agents are producing general knowledge that increases the likelihood of solving the task?"
  audience: supervisor

- text: "A healthy Station must contain opposing schools of thought at the conceptual level, not merely diverse technical lines of exploration. A common failure mode is for all agents to become trapped within the same conceptual framework, often shaped by a small number of dominant archival papers. Did you observe this kind of conceptual trap? Are there any active lanes that challenge assumptions made in older papers? How can you cultivate opposing schools of thought at the conceptual level? What opposing schools of thought might emerge if human researchers were tackling this problem?"
  audience: supervisor

- text: "How are you ensuring that failed experiments are properly analyzed and converted into reusable negative knowledge, rather than being discarded or misinterpreted?"
  audience: supervisor

- text: "As a supervisor, how do you ensure that the Station periodically steps back for high-level reflection instead of remaining in continuous execution mode? How do you prevent the Station being trapped in a single conceptual framework or attractor task without stepping back to reflect on the bigger picture?"
  audience: supervisor

- text: "As a supervisor, did you implicitly try to impose your own conceptual framework on the agent, especially one you had already adopted before becoming a supervisor? Has your conceptual framework biased the whole Station toward a single dominant framework? If no agent is challenging your guidance, that is a major red flag. Encourage them to challenge you."
  audience: supervisor

- text: "As a supervisor, are you rewarding safe, incremental work over high-risk, high-reward exploration? How can you recalibrate incentives to better align with breakthrough potential?"
  audience: supervisor

- text: "Review your approved Research Proposals: did they achieve the intended results? Should they have been approved in hindsight? Should you loosen or tighten the threshold for strategic value in future approvals?"
  audience: supervisor
